<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顺手帮 · 校园跑腿互助平台</title>
<link rel="stylesheet" href="vendor/weui.min.css">
<link rel="stylesheet" href="vendor/devices-iphone14pro.css">
<link rel="stylesheet" href="assets/phone.css">
<link rel="stylesheet" href="assets/lanes.css">
<link rel="stylesheet" href="assets/mp.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-weui-theme="light">

<header class="bar">
  <b>顺手帮<small>校园跑腿互助平台 · 暂定名</small></b>
  <nav id="nav">
    <a href="#brief" class="is-on"><i>00</i>审题</a>
    <a href="#demo"><i>01</i>产品演示</a>
    <a href="#plan"><i>02</i>产品方案</a>
    <a href="#how"><i>03</i>我是怎么做的</a>
    <a href="#scope"><i>04</i>PRD</a>
  </nav>
</header>

<main>
  <section class="brief" id="brief"></section>

  <section class="stage" id="demo">
    <div class="st-main" id="st-main">
      <button class="play" id="play" data-ctl="auto" type="button"><span class="play-t"><span id="mode">进入演示区后自动播放</span><span id="remain"></span></span><em id="play-act">开始</em><i class="play-bar"><u id="play-fill"></u></i></button>
      <span class="st-sample">姓名、地址、取件码都是示例 · 价格是假设</span>
      <div class="st-side" id="st-side"></div>
      <div class="solo-switch" hidden>
        <button data-solo="L">发单同学</button>
        <button data-solo="R">接单同学</button>
      </div>
      <div class="phones" id="phones"></div>
    </div>
    <div class="rail">
      <div class="rail-steps" id="rail-steps"></div>
      <div class="rail-ctl">
        <button data-ctl="prev">上一步</button>
        <button data-ctl="next">下一步</button>
        <button data-ctl="replay">重播</button>
        <button data-ctl="end" id="end-btn">结束演示，看方案</button>
      </div>
    </div>
  </section>

  <section class="plan" id="plan"></section>
  <section class="how" id="how"></section>
  <section class="scope" id="scope"></section>
</main>

<div id="fly-layer"></div>
<div id="lock-hint" role="status" hidden></div>

<script src="content/masks.js"></script>
<script src="content/data.js"></script>
<script src="content/research.js"></script>
<script src="content/screens.js"></script>
<script src="content/steps.js"></script>
<script src="content/plan.js"></script>
<script src="content/process.js"></script>
<script src="assets/page.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
